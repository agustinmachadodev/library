<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"rel="stylesheet">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>Library</h1>
    </header>

    <div class="library__container"></div>

    <form action="#" class="form">
        <button class="closed-btn">✕</button>
        <fieldset class="form__container">
            <legend>New Book</legend>

            <div class="title">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="author">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="pages">
                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" required>
            </div>

            <div class="read__container">
                <div class="read">
                    <input type="radio" name="read" id="read">
                    <label for="read">Read</label>
                </div>
                <div class="unread">
                    <input type="radio" name="read" id="unread">
                    <label for="unread">Unread</label>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="submit-btn btn">Add</button>
    </form>

    <button class="add-book-btn btn">Add Book</button>

    <script src="script.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7/dist/ionicons/ionicons.js"></script>
</body>

</html>
